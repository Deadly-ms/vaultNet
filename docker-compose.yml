version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: fintech_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - fintech_network

  cache:
    image: redis:alpine
    container_name: fintech_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - fintech_network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: fintech_gateway
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MASTER_PIN=${MASTER_PIN}
      - QUANT_ENGINE_URL=${QUANT_ENGINE_URL}
    depends_on:
      - db
      - cache
    volumes:
      - ./gateway:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - fintech_network

  quant-engine:
    build:
      context: ./quant-engine
      dockerfile: Dockerfile
    container_name: fintech_quant_engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - FLASK_ENV=development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./quant-engine:/usr/src/app
    networks:
      - fintech_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintech_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - gateway
    networks:
      - fintech_network

volumes:
  pgdata:
  redisdata:

networks:
  fintech_network:
    driver: bridge
